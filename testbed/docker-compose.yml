name: sepp-testbed

services:
  llm-app:
    build: ./llm-app
    container_name: sepp-testbed
    # LOCALHOST ONLY: the app is deliberately vulnerable; never publish wider.
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      TESTBED_GUARDS: ${TESTBED_GUARDS:-naive}
      TESTBED_BACKEND: ${TESTBED_BACKEND:-mock}
      TESTBED_MARKER: ${TESTBED_MARKER:-}
      TESTBED_DATA_DIR: /data
    volumes:
      - testbed-data:/data
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  testbed-data:
